<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Robot head -->
  <rect x="40" y="35" width="48" height="40" rx="5" fill="#FFFFFF"/>
  
  <!-- Eyes -->
  <circle cx="54" cy="50" r="5" fill="#4A90E2"/>
  <circle cx="74" cy="50" r="5" fill="#4A90E2"/>
  
  <!-- Antenna -->
  <line x1="64" y1="35" x2="64" y2="25" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="64" cy="22" r="4" fill="#FFD700"/>
  
  <!-- Mouth/smile -->
  <path d="M 50 65 Q 64 72 78 65" stroke="#4A90E2" stroke-width="2" fill="none"/>
  
  <!-- Wrench (fixing tool) -->
  <g transform="translate(75, 75) rotate(-30)">
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#FFD700"/>
    <circle cx="20" cy="3" r="5" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>
  
  <!-- Check mark (success) -->
  <path d="M 35 85 L 42 92 L 52 78" stroke="#50C878" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>

